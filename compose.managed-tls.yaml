services:
  caddy:
    profiles: [queue]
    build:
      context: ./deploy/ingress
      dockerfile: Dockerfile.managed
    image: passport-backend-ingress-managed:2.11.7
    read_only: true
    init: true
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PASSPORT_TLS_DOMAIN: ${PASSPORT_TLS_DOMAIN:?Set PASSPORT_TLS_DOMAIN to the public hostname}
      PASSPORT_CADDY_UID: ${PASSPORT_APP_UID:-10001}
      PASSPORT_CADDY_GID: ${PASSPORT_APP_GID:-10001}
    ports:
      - "${PASSPORT_PUBLIC_BIND:-0.0.0.0}:80:8080"
      - "${PASSPORT_PUBLIC_BIND:-0.0.0.0}:443:8443"
    tmpfs:
      - /run/passport-caddy:mode=0700,uid=${PASSPORT_APP_UID:-10001},gid=${PASSPORT_APP_GID:-10001},size=1m
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && wget -q -T 3 -O /dev/null http://api:8080/readyz"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s
    networks:
      egress:
        gw_priority: 1
      private:
        ipv4_address: ${PASSPORT_INGRESS_IP:-172.30.0.20}

volumes:
  caddy_data:
  caddy_config:

networks:
  egress:
    driver: bridge
