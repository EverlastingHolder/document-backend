openapi: 3.0.3
info:
  title: API распознавания документов
  version: 0.5.0
  description: >-
    Контракт API для распознавания изображений документов, асинхронной обработки
    и агрегированной статистики. Результат распознавания является кандидатом
    и требует проверки человеком. Доступ ограничивается адресом клиента и
    настройками сервера.

    Общие ошибки в ответах default: 400 — некорректный запрос, заголовок или тело;
    401 — токен отсутствует или недействителен в защищённых операциях; 403 —
    доступ запрещён настройками сервера или состоянием токена при регистрации;
    405 — неподдерживаемый метод (заголовок Allow указан только при 405); 503 —
    операция временно недоступна. Специальные ошибки указаны рядом с операцией.
servers:
  - url: /
    description: Относительный адрес. Адрес, порт и список разрешённых сетей задаются при запуске сервера.
paths:
  /v1/client-installations:
    post:
      operationId: enrollClientInstallation
      summary: Зарегистрировать установку клиента
      description: >-
        Принимает SHA-256 хеш созданного клиентом токена и возвращает постоянный
        идентификатор установки. Сам токен не передаётся и не сохраняется.
        Повторный запрос с тем же хешем возвращает прежний идентификатор.
        Операция доступна при включённой конфигурации регистрации.
      security: []
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          description: Необязательный идентификатор запроса в формате UUID.
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientInstallationRequest'
      responses:
        '201':
          description: Регистрация установки выполнена.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              description: Запрещает кэширование ответа.
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientInstallationResponse'}
        '200':
          description: Повторная регистрация. Возвращены прежние идентификатор и дата.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              description: Запрещает кэширование ответа.
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientInstallationResponse'}
        '429':
          description: Превышен настроенный лимит регистрации.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClientInstallationErrorResponse'}
        default:
          $ref: '#/components/responses/ClientInstallationDefaultError'
  /v1/passport/jobs:
    post:
      operationId: submitPassportJob
      summary: Создать задание распознавания
      description: >-
        Принимает изображение и создаёт асинхронное задание. Ответ 202 означает,
        что задание принято, но обработка ещё не завершена. Для обработки
        требуется включённая очередь и запущенный обработчик. Повтор с тем же
        ключом идемпотентности возвращает то же задание.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: >-
            Случайный ключ запроса длиной от 1 до 128 печатных ASCII-символов.
            Не включайте в него персональные данные. Повтор с тем же ключом и
            содержимым возвращает прежнее задание; другое содержимое даёт 409.
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[!-~]{1,128}$'
        - name: X-Request-ID
          in: header
          required: false
          description: Необязательный UUID запроса. Повторный заголовок отклоняется; UUID не определяет владельца.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Изображение документа.
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '202':
          description: Задание принято. Распознавание может начаться позже; ответ содержит его текущее состояние и адрес проверки статуса.
          headers:
            Location:
              description: Адрес проверки статуса задания.
              schema: {type: string, format: uri-reference}
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '409':
          description: Ключ идемпотентности уже использован с другим содержимым.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AsyncErrorResponse'}
        '413':
          description: Размер файла или запроса превышает настроенный лимит.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AsyncErrorResponse'}
        '415':
          description: Тип файла не поддерживается.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AsyncErrorResponse'}
        default:
          $ref: '#/components/responses/AsyncSubmissionDefaultError'
  /v1/passport/jobs/{job_id}:
    get:
      operationId: getPassportJob
      summary: Получить статус задания
      description: >-
        Возвращает статус задания и, после завершения, результат или ошибку.
        Доступно владельцу задания. Для отсутствующих и чужих заданий
        возвращается 404. Удалённый результат возвращает 410.
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-Request-ID
          in: header
          required: false
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Текущее состояние задания.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
            Cache-Control:
              description: Запрещает кэширование статуса и результата.
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '404':
          description: Задание не найдено или недоступно.
          headers:
            Cache-Control:
              description: Запрещает кэширование ответа.
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AsyncErrorResponse'}
        '410':
          description: Результат задания удалён.
          headers:
            Cache-Control:
              description: Запрещает кэширование ответа.
              schema: {type: string, enum: [no-store]}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AsyncErrorResponse'}
        default:
          $ref: '#/components/responses/AsyncStatusDefaultError'
  /v1/passport/jobs/{job_id}/receipt:
    post:
      operationId: acknowledgePassportJobResult
      summary: Подтвердить получение результата
      description: >-
        Вызовите после применения результата в клиенте. Удаляет результат
        задания; повторный вызов также возвращает успешный ответ. Для задания,
        обработка которого ещё не завершена, возвращается 409.
      security:
        - bearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: X-Request-ID
          in: header
          required: false
          schema: {type: string, format: uuid}
      responses:
        '204':
          description: Получение подтверждено или результат уже удалён.
          headers:
            Cache-Control:
              description: Запрещает кэширование ответа.
              schema: {type: string, enum: [no-store]}
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
        '404':
          description: Задание не найдено или недоступно.
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AsyncErrorResponse'}
        '409':
          description: Подтвердить можно только завершённое задание.
          headers:
            Cache-Control: {schema: {type: string, enum: [no-store]}}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AsyncErrorResponse'}
        default:
          $ref: '#/components/responses/AsyncReceiptDefaultError'
  /v1/stats:
    get:
      operationId: getStatistics
      summary: Получить статистику
      description: >-
        Возвращает накопительные агрегаты запросов и распознавания. Ответ не
        содержит данные отдельных запросов или изображений.
      parameters:
        - name: X-Request-ID
          in: header
          required: false
          description: Некорректный или повторяющийся заголовок X-Request-ID вызывает ошибку 400.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Снимок накопительной статистики.
          headers:
            X-Request-ID:
              $ref: '#/components/headers/RequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatisticsResponse'
        default:
          $ref: '#/components/responses/StatisticsDefaultError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Токен доступа для асинхронных операций. Передавайте его в заголовке
        Authorization: Bearer. Для незащищённых сетей используйте HTTPS.
  headers:
    RequestID:
      description: UUID запроса. Если заголовок отсутствует, некорректен или повторяется, сервер создаёт новый.
      schema:
        type: string
        format: uuid
  responses:
    ClientInstallationDefaultError:
      description: Общий ответ об ошибке; коды и область применения перечислены в общей секции.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          description: Запрещает кэширование ответа.
          schema: {type: string, enum: [no-store]}
        Allow:
          description: Передаётся только при статусе 405.
          schema: {type: string, enum: [POST]}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ClientInstallationErrorResponse'}
    AsyncSubmissionDefaultError:
      description: Общий ответ об ошибке; коды и область применения перечислены в общей секции.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Allow:
          description: Передаётся только при статусе 405.
          schema: {type: string, enum: [POST]}
        WWW-Authenticate:
          description: Передаётся только при статусе 401.
          schema: {type: string, example: 'Bearer realm="passport-jobs"'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AsyncErrorResponse'}
    AsyncStatusDefaultError:
      description: Общий ответ об ошибке; коды и область применения перечислены в общей секции.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          description: Запрещает кэширование ответа.
          schema: {type: string, enum: [no-store]}
        Allow:
          description: Передаётся только при статусе 405.
          schema: {type: string, enum: [GET]}
        WWW-Authenticate:
          description: Передаётся только при статусе 401.
          schema: {type: string, example: 'Bearer realm="passport-jobs"'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AsyncErrorResponse'}
    AsyncReceiptDefaultError:
      description: Общий ответ об ошибке; коды и область применения перечислены в общей секции.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Cache-Control:
          description: Запрещает кэширование ответа.
          schema: {type: string, enum: [no-store]}
        Allow:
          description: Передаётся только при статусе 405.
          schema: {type: string, enum: [POST]}
        WWW-Authenticate:
          description: Передаётся только при статусе 401.
          schema: {type: string, example: 'Bearer realm="passport-jobs"'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/AsyncErrorResponse'}
    StatisticsDefaultError:
      description: Общий ответ об ошибке; коды и область применения перечислены в общей секции.
      headers:
        X-Request-ID:
          $ref: '#/components/headers/RequestID'
        Allow:
          description: Передаётся только при статусе 405.
          schema: {type: string, enum: [GET]}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorResponse'}
  schemas:
    ClientInstallationRequest:
      type: object
      additionalProperties: false
      required: [token_sha256]
      properties:
        token_sha256:
          type: string
          minLength: 64
          maxLength: 64
          pattern: '^[0-9a-f]{64}$'
          description: SHA-256 хеш токена клиента. Сам токен передавать нельзя.
    ClientInstallationResponse:
      type: object
      additionalProperties: false
      required: [client_id, created_at]
      properties:
        client_id: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    JobAcceptedResponse:
      type: object
      additionalProperties: false
      required: [job_id, status, status_url, created_at]
      properties:
        job_id: {type: string, format: uuid}
        status:
          type: string
          enum: [queued, processing, completed, failed]
          description: Текущее состояние задания при формировании ответа.
        status_url:
          type: string
          format: uri-reference
          description: Адрес проверки статуса задания.
        created_at: {type: string, format: date-time}
    JobStatusResponse:
      description: Статус задания и результат после завершения обработки.
      oneOf:
        - {$ref: '#/components/schemas/QueuedJobStatus'}
        - {$ref: '#/components/schemas/ProcessingJobStatus'}
        - {$ref: '#/components/schemas/CompletedJobStatus'}
        - {$ref: '#/components/schemas/FailedJobStatus'}
      discriminator:
        propertyName: status
        mapping:
          queued: '#/components/schemas/QueuedJobStatus'
          processing: '#/components/schemas/ProcessingJobStatus'
          completed: '#/components/schemas/CompletedJobStatus'
          failed: '#/components/schemas/FailedJobStatus'
    QueuedJobStatus:
      type: object
      additionalProperties: false
      required: [job_id, status, created_at, updated_at, started_at, finished_at]
      properties:
        job_id: {type: string, format: uuid}
        status: {type: string, enum: [queued]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time, nullable: true}
    ProcessingJobStatus:
      type: object
      additionalProperties: false
      required: [job_id, status, created_at, updated_at, started_at, finished_at]
      properties:
        job_id: {type: string, format: uuid}
        status: {type: string, enum: [processing]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time, nullable: true}
    CompletedJobStatus:
      type: object
      additionalProperties: false
      required: [job_id, status, created_at, updated_at, started_at, finished_at, result]
      properties:
        job_id: {type: string, format: uuid}
        status: {type: string, enum: [completed]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time}
        result: {$ref: '#/components/schemas/RecognitionResponse'}
    FailedJobStatus:
      type: object
      additionalProperties: false
      required: [job_id, status, created_at, updated_at, started_at, finished_at, error]
      properties:
        job_id: {type: string, format: uuid}
        status: {type: string, enum: [failed]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time, nullable: true}
        finished_at: {type: string, format: date-time}
        error: {$ref: '#/components/schemas/JobError'}
    JobError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [image_unprocessable, processing_failed, ocr_unavailable, processing_timeout]
          description: Код ошибки обработки.
        message:
          type: string
          minLength: 1
          description: Краткое сообщение об ошибке.
    StatisticsResponse:
      type: object
      additionalProperties: false
      required: [request_id, statistics]
      properties:
        request_id:
          type: string
          format: uuid
        statistics:
          $ref: '#/components/schemas/StatisticsSnapshot'
    StatisticsSnapshot:
      type: object
      additionalProperties: false
      required: [schema_version, pipeline_version, since, updated_at, persistence, http, ocr, stages]
      properties:
        schema_version:
          type: string
          enum: [passport-metrics/v1]
        pipeline_version:
          type: string
          minLength: 1
        since:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        persistence:
          type: object
          additionalProperties: false
          required: [healthy, error_code]
          properties:
            healthy:
              type: boolean
            error_code:
              type: string
              enum: ['', metrics_write_failed]
        http:
          type: object
          additionalProperties: false
          required: [total, errors, by_status, duration, response_bytes_total]
          properties:
            total: {type: integer, format: int64, minimum: 0}
            errors: {type: integer, format: int64, minimum: 0}
            by_status:
              type: object
              additionalProperties: false
              required: ['0', '200', '400', '403', '404', '405', '413', '415', '422', '429', '500', '503', '504']
              properties:
                '0': {type: integer, format: int64, minimum: 0}
                '200': {type: integer, format: int64, minimum: 0}
                '400': {type: integer, format: int64, minimum: 0}
                '403': {type: integer, format: int64, minimum: 0}
                '404': {type: integer, format: int64, minimum: 0}
                '405': {type: integer, format: int64, minimum: 0}
                '413': {type: integer, format: int64, minimum: 0}
                '415': {type: integer, format: int64, minimum: 0}
                '422': {type: integer, format: int64, minimum: 0}
                '429': {type: integer, format: int64, minimum: 0}
                '500': {type: integer, format: int64, minimum: 0}
                '503': {type: integer, format: int64, minimum: 0}
                '504': {type: integer, format: int64, minimum: 0}
            duration:
              $ref: '#/components/schemas/DurationHistogram'
            response_bytes_total: {type: integer, format: int64, minimum: 0}
        ocr:
          type: object
          additionalProperties: false
          required: [total, completed, failed, by_error_code, duration]
          properties:
            total: {type: integer, format: int64, minimum: 0}
            completed: {type: integer, format: int64, minimum: 0}
            failed: {type: integer, format: int64, minimum: 0}
            by_error_code:
              type: object
              additionalProperties: false
              required: [image_unprocessable, runtime_unavailable, deadline_exceeded, cancelled, pipeline_failed, processing_failed]
              properties:
                image_unprocessable: {type: integer, format: int64, minimum: 0}
                runtime_unavailable: {type: integer, format: int64, minimum: 0}
                deadline_exceeded: {type: integer, format: int64, minimum: 0}
                cancelled: {type: integer, format: int64, minimum: 0}
                pipeline_failed: {type: integer, format: int64, minimum: 0}
                processing_failed: {type: integer, format: int64, minimum: 0}
            duration:
              $ref: '#/components/schemas/DurationHistogram'
        stages:
          type: object
          additionalProperties: false
          required: [ocr, baseline, vl, extract]
          properties:
            ocr: {$ref: '#/components/schemas/StageStatistics'}
            baseline: {$ref: '#/components/schemas/StageStatistics'}
            vl: {$ref: '#/components/schemas/StageStatistics'}
            extract: {$ref: '#/components/schemas/StageStatistics'}
    StageStatistics:
      type: object
      additionalProperties: false
      required: [completed, failed, duration]
      properties:
        completed: {type: integer, format: int64, minimum: 0}
        failed: {type: integer, format: int64, minimum: 0}
        duration:
          $ref: '#/components/schemas/DurationHistogram'
    DurationHistogram:
      type: object
      additionalProperties: false
      required: [count, sum_ms, min_ms, max_ms, buckets]
      properties:
        count: {type: integer, format: int64, minimum: 0}
        sum_ms: {type: integer, format: int64, minimum: 0}
        min_ms: {type: integer, format: int64, minimum: 0}
        max_ms: {type: integer, format: int64, minimum: 0}
        buckets:
          type: array
          minItems: 16
          maxItems: 16
          items:
            type: object
            additionalProperties: false
            required: [le_ms, count]
            properties:
              le_ms:
                type: integer
                nullable: true
                enum: [10, 50, 100, 250, 500, 1000, 2500, 5000, 10000, 30000, 60000, 120000, 300000, 600000, 86400000, null]
              count: {type: integer, format: int64, minimum: 0}
    RecognitionResponse:
      type: object
      additionalProperties: false
      required: [request_id, status, review_required, pipeline_version, fields, warnings]
      properties:
        request_id:
          type: string
          format: uuid
          description: UUID запроса.
        status:
          type: string
          enum: [completed]
          description: Статус обработки.
        review_required:
          type: boolean
          enum: [true]
          description: Требуется проверка человеком.
        pipeline_version:
          type: string
          minLength: 1
          description: Идентификатор версии конвейера обработки.
        fields:
          type: object
          additionalProperties: false
          required:
            - surname
            - given_name
            - patronymic
            - gender
            - birth_date
            - birth_place
            - series
            - number
            - issue_date
            - issuer
            - department_code
          properties:
            surname:
              allOf:
                - $ref: '#/components/schemas/FieldResult'
                - $ref: '#/components/schemas/NameFieldResult'
              description: Фамилия без изменений.
            given_name:
              allOf:
                - $ref: '#/components/schemas/FieldResult'
                - $ref: '#/components/schemas/NameFieldResult'
              description: Имя без изменений.
            patronymic:
              allOf:
                - $ref: '#/components/schemas/FieldResult'
                - $ref: '#/components/schemas/NameFieldResult'
              description: Ключ всегда присутствует. Значение может быть null.
            gender:
              allOf:
                - $ref: '#/components/schemas/FieldResult'
                - type: object
                  properties:
                    value:
                      type: string
                      nullable: true
                      enum: [M, F, null]
              description: "Значения: M или F."
            birth_date:
              allOf:
                - $ref: '#/components/schemas/FieldResult'
                - $ref: '#/components/schemas/DateFieldResult'
              description: Дата в формате YYYY-MM-DD.
            birth_place:
              allOf:
                - $ref: '#/components/schemas/FieldResult'
                - $ref: '#/components/schemas/NonEmptyStringFieldResult'
              description: Место рождения.
            series:
              allOf:
                - $ref: '#/components/schemas/FieldResult'
                - type: object
                  properties:
                    value:
                      type: string
                      nullable: true
                      pattern: '^[0-9]{4}$'
              description: Четыре цифры. Начальные нули сохраняются.
            number:
              allOf:
                - $ref: '#/components/schemas/FieldResult'
                - type: object
                  properties:
                    value:
                      type: string
                      nullable: true
                      pattern: '^[0-9]{6}$'
              description: Шесть цифр. Начальные нули сохраняются.
            issue_date:
              allOf:
                - $ref: '#/components/schemas/FieldResult'
                - $ref: '#/components/schemas/DateFieldResult'
              description: Дата в формате YYYY-MM-DD.
