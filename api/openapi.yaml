    FieldResult:
      type: object
      additionalProperties: false
      required: [value, state, issues]
      properties:
        value:
          type: string
          nullable: true
          minLength: 1
          description: Распознанное значение или null. Серия и номер передаются строками.
        state:
          type: string
          enum: [recognized, uncertain, missing]
        issues:
          type: array
          items:
            $ref: '#/components/schemas/FieldIssue'
      oneOf:
        - required: [value, state, issues]
          properties:
            value:
              type: string
              minLength: 1
              nullable: false
            state:
              type: string
              enum: [recognized]
            issues:
              type: array
              maxItems: 0
        - required: [value, state, issues]
          properties:
            value:
              type: string
              minLength: 1
              nullable: true
            state:
              type: string
              enum: [uncertain]
            issues:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/FieldIssue'
        - required: [value, state, issues]
          properties:
            value:
              type: string
              nullable: true
              enum: [null]
            state:
              type: string
              enum: [missing]
            issues:
              type: array
              items:
                $ref: '#/components/schemas/FieldIssue'
    FieldIssue:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - conflicting_field_candidates
            - manual_review_required
            - date_invalid_calendar_or_format
          description: Код проблемы поля.
        message:
          type: string
          minLength: 1
          description: Краткое сообщение для отображения.
    RecognitionWarning:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
          enum: [no_fields_recognized]
          description: Код предупреждения.
        message:
          type: string
          minLength: 1
          description: Краткое сообщение для отображения.
    NonEmptyStringFieldResult:
      type: object
      properties:
        value:
          type: string
          nullable: true
          minLength: 1
    NameFieldResult:
      allOf:
        - $ref: '#/components/schemas/NonEmptyStringFieldResult'
    DateFieldResult:
      type: object
      properties:
        value:
          type: string
          nullable: true
          format: date
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          description: Дата проверяется с учётом календаря.
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [request_id, code, message]
      properties:
        request_id:
          type: string
          format: uuid
        code:
          type: string
          enum:
            - invalid_request
            - access_denied
            - upload_too_large
            - unsupported_media_type
            - image_unprocessable
            - concurrency_limit_reached
            - processing_failed
            - ocr_unavailable
            - processing_timeout
            - not_found
            - method_not_allowed
            - statistics_unavailable
          description: Машиночитаемый код ошибки.
        message:
          type: string
          minLength: 1
          description: Сообщение об ошибке.
    ClientInstallationErrorResponse:
      description: Ответ с ошибкой регистрации клиента.
      type: object
      additionalProperties: false
      required: [request_id, code, message]
      properties:
        request_id: {type: string, format: uuid}
        code:
          type: string
          enum:
            - invalid_request
            - access_denied
            - method_not_allowed
            - registration_rate_limited
            - client_registration_unavailable
        message:
          type: string
          minLength: 1
          description: Сообщение об ошибке.
    AsyncErrorResponse:
      description: Ответ с ошибкой асинхронной операции.
      type: object
      additionalProperties: false
      required: [request_id, code, message]
      properties:
        request_id:
          type: string
          format: uuid
        code:
          type: string
          enum:
            - invalid_request
            - access_denied
            - upload_too_large
            - unsupported_media_type
            - unauthorized
            - idempotency_conflict
            - job_acceptance_unavailable
            - job_status_unavailable
            - not_found
            - method_not_allowed
            - job_not_terminal
            - job_result_gone
          description: Код ошибки асинхронной операции.
        message:
          type: string
          minLength: 1
          description: Сообщение об ошибке.
