<!doctype html>
<html lang="ru">
  <head>
    <title>Документация API</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--scalar-color-1, #20252b);
      }

      .access-toolbar {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        min-height: 3rem;
        padding: 0.375rem 1.5rem;
        border-bottom: 1px solid var(--scalar-border-color, #d8dee5);
        background: var(--scalar-background-1, #fff);
      }

      .access-toolbar__label {
        flex: 0 0 auto;
        font-size: 0.875rem;
        font-weight: 600;
      }

      .access-toolbar__status {
        flex: 1 1 auto;
        min-width: 0;
        margin: 0;
        color: var(--scalar-color-2, #4c5967);
        font-size: 0.8125rem;
      }

      .access-toolbar__button {
        flex: 0 0 auto;
        min-height: 2.125rem;
        padding: 0.375rem 0.75rem;
        border: 1px solid var(--scalar-color-accent, #09f);
        border-radius: 0.375rem;
        background: var(--scalar-background-1, #fff);
        color: var(--scalar-color-accent, #09f);
        font: inherit;
        font-size: 0.8125rem;
        font-weight: 600;
        cursor: pointer;
      }

      .access-toolbar__button:hover:not(:disabled) {
        background: var(--scalar-background-2, #f6f6f6);
      }

      .access-toolbar__button:focus-visible {
        outline: 2px solid var(--scalar-color-accent, #09f);
        outline-offset: 2px;
      }

      .access-toolbar__button:disabled {
        cursor: default;
        opacity: 0.65;
      }

      @media (max-width: 640px) {
        .access-toolbar {
          display: grid;
          grid-template-columns: minmax(0, 1fr) auto;
          gap: 0.25rem 0.75rem;
          padding: 0.5rem 0.75rem;
        }

        .access-toolbar__status {
          grid-column: 1;
          grid-row: 2;
        }

        .access-toolbar__button {
          grid-column: 2;
          grid-row: 1 / span 2;
        }
      }
    </style>
  </head>
  <body>
    <header class="access-toolbar" aria-label="Авторизация API">
      <span class="access-toolbar__label">Авторизация API</span>
      <p class="access-toolbar__status" id="access-status" role="status" aria-live="polite">
        Не подключено
      </p>
      <button class="access-toolbar__button" id="create-access" type="button">
        Авторизовать
      </button>
    </header>
    <main id="scalar-reference-root"></main>
    <script src="/scalar.js"></script>
    <script src="/app.js" defer></script>
  </body>
</html>
