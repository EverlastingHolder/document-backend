services:
  caddy:
    profiles: [queue]
    build:
      context: ./deploy/ingress
      dockerfile: Dockerfile.lan
    image: passport-backend-ingress-lan:2.11.7
    read_only: true
    init: true
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PASSPORT_CADDY_UID: ${PASSPORT_APP_UID:-10001}
      PASSPORT_CADDY_GID: ${PASSPORT_APP_GID:-10001}
    ports:
      - "${PASSPORT_PUBLIC_BIND:?LAN mode requires PASSPORT_PUBLIC_BIND}:${PASSPORT_HTTP_PORT:-8080}:8080"
    tmpfs:
      - /run/passport-caddy:mode=0700,uid=${PASSPORT_APP_UID:-10001},gid=${PASSPORT_APP_GID:-10001},size=1m
      - /data:mode=0700,uid=${PASSPORT_APP_UID:-10001},gid=${PASSPORT_APP_GID:-10001},size=16m
      - /config:mode=0700,uid=${PASSPORT_APP_UID:-10001},gid=${PASSPORT_APP_GID:-10001},size=1m
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 && wget -q -T 3 -O /dev/null http://api:8080/readyz"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s
    networks:
      egress:
        gw_priority: 1
      private:
        ipv4_address: ${PASSPORT_INGRESS_IP:-172.30.0.20}

networks:
  egress:
    driver: bridge
